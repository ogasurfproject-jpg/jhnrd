name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: run the validator
        run: python3 tools/validate.py
      - name: the README numbers must match status.json
        run: |
          python3 tools/update_readme.py --check || {
            echo "README numbers are out of step with status.json."
            echo "Run python3 tools/update_readme.py --write and commit README.md too."
            exit 1
          }
      - name: the machine-readable metadata must match status.json
        run: |
          python3 tools/make_metadata.py --check || {
            echo "datapackage.json / .zenodo.json are out of step with status.json."
            echo "Run python3 tools/make_metadata.py --write and commit them too."
            exit 1
          }
      - name: the copy the public MCP serves must match the data
        run: |
          python3 tools/make_mcp_data.py --check || {
            echo "mcp/rules.data.js is out of step with data/rules_2024.json."
            echo "Run python3 tools/make_mcp_data.py --write and commit it too."
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: the public MCP must not answer a billing question
        run: node mcp/mcp_test.mjs
      - name: the once-a-day live check must itself still work
        run: python3 tools/test_live_workflow.py
      - name: the conflict-of-interest disclosure must still be there
        run: |
          python3 -c "
          import io, sys
          need = [
              ('README.md', '## 利益相反の開示'),
              ('README.md', '有償のサービスを訪問看護事業所に販売しています'),
              ('README_en.md', '## Conflict of interest'),
              ('GOVERNANCE.md', '有償のサービスを、訪問看護事業所に販売しています'),
              ('datapackage.json', 'conflict_of_interest'),
              ('.zenodo.json', 'Conflict of interest'),
          ]
          bad = [(f, s) for f, s in need
                 if s not in io.open(f, encoding='utf-8').read()]
          for f, s in bad:
              print('missing from %s: %s' % (f, s))
          if bad:
              print('')
              print('The disclosure is not decoration. A dataset that sells a service on top')
              print('of itself and stops saying so has stopped being usable as a measure.')
              sys.exit(1)
          print('disclosure present in all %d places' % len(need))
          "
      - name: status.json must match the data
        run: |
          git diff --exit-code -- status.json || {
            echo "status.json is out of step with the data."
            echo "Run python3 tools/validate.py and commit status.json too."
            exit 1
          }
      - name: surface the statute count instead of hiding it
        run: |
          python3 -c "
          import json
          s = json.load(open('status.json', encoding='utf-8'))
          st = s['sources']['statute']
          print('sources tier=statute: %d' % st)
          print('items %d / unconfirmed %d / open conflicts %d' % (s['items'], s['unconfirmed_requirements'], s['open_conflicts']))
          if st == 0:
              print('No item rests on the statute text yet. Not a failure, but not usable for a billing decision either.')
          "
